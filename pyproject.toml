[project]
name = "due-board"
version = "0.3.0"
description = "Multi-institution LMS deadline board (Canvas + Ed) with encrypted tokens and email digests. Formerly usyd-due-reminders."
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "cryptography>=43.0",
  "pydantic-settings>=2.4",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
due-board = "remind:main"
due-board-web = "web.app:run"
due-board-worker = "web.worker:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dues_lib", "web"]

# Hatch already packs non-.py files under packages/; only force-include root modules.
[tool.hatch.build.targets.wheel.force-include]
"remind.py" = "remind.py"
"config.yaml" = "config.yaml"
