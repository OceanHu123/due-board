# Render Blueprint — free tier: Web only + external Postgres.
#
# Why no Render Postgres here: Render's *free* Postgres expires 30 days after
# creation (14-day grace, then the data is deleted, no backups). We use an
# always-free external database instead (Neon) and set DATABASE_URL by hand.
#
# The `databases:` block was removed on purpose. Blueprint sync never deletes
# an existing resource, so the old Render Postgres stays alive until you delete
# it yourself in the dashboard — keep it until the Neon migration is verified.
#
# See docs/DEPLOY_RENDER.md (section "Migrating off Render Postgres").

services:
  - type: web
    name: due-board
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: BASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      # Never regenerate this after the first deploy: it decrypts the Canvas/Ed
      # tokens stored in the database. Rotating it orphans every saved token.
      - key: TOKEN_FERNET_KEY
        sync: false
      # External Postgres connection string (Neon free tier). Paste it in the
      # Render dashboard — Render never manages this value.
      - key: DATABASE_URL
        sync: false
      - key: REQUIRE_MAIL
        value: "false"
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: GITHUB_URL
        value: https://github.com/OceanHu123/due-board
