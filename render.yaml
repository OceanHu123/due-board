# Render Blueprint — free tier: Web + Postgres only (no Worker).
# Workers are not available on the free plan.
# No custom domain required: https://<service>.onrender.com
# See docs/DEPLOY_RENDER.md

services:
  - type: web
    name: usyd-due-web
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: BASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: TOKEN_FERNET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: usyd-due-db
          property: connectionString
      - key: REQUIRE_MAIL
        value: "false"
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: GITHUB_URL
        value: https://github.com/OceanHu123/usyd-due-reminders

databases:
  - name: usyd-due-db
    plan: free
