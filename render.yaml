# Render Blueprint — https://render.com/docs/blueprint-spec
# No custom domain required: use https://<service>.onrender.com
# See docs/DEPLOY_RENDER.md for the full checklist (Chinese).

services:
  - type: web
    name: usyd-due-web
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: BASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: TOKEN_FERNET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: usyd-due-db
          property: connectionString
      # Board-first: false = site works without Resend. Set true only if sending mail.
      - key: REQUIRE_MAIL
        value: "false"
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: GITHUB_URL
        sync: false

  - type: worker
    name: usyd-due-worker
    runtime: docker
    dockerCommand: usyd-due-worker --loop --interval 900
    plan: free
    envVars:
      - key: BASE_URL
        sync: false
      - key: SECRET_KEY
        fromService:
          type: web
          name: usyd-due-web
          envVarKey: SECRET_KEY
      - key: TOKEN_FERNET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: usyd-due-db
          property: connectionString
      - key: REQUIRE_MAIL
        value: "false"
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_FROM
        sync: false

databases:
  - name: usyd-due-db
    plan: free
